<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test — Status</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <h1 class="site-header__title">Test</h1>
        <p class="site-header__tagline">test</p>
      </div>
    </header>

    <main class="site-main">
      <div id="status-main" class="site-main__status" aria-live="polite">
        <p class="site-main__loading">Loading status…</p>
      </div>

      <section
        id="changelog-section"
        class="changelog"
        aria-labelledby="changelog-heading"
      >
        <h2 id="changelog-heading" class="changelog__title">Changelog</h2>
        <div id="changelog-root" class="changelog__root">
          <p class="changelog__loading">Loading changelog…</p>
        </div>

        <aside
          class="changelog-updates"
          aria-labelledby="changelog-updates-heading"
        >
          <h3 id="changelog-updates-heading" class="changelog-updates__title">
            Get updates
          </h3>
          <p class="changelog-updates__hint">
            Email alerts for new releases (pilot—no data is sent yet).
          </p>
          <form
            id="changelog-updates-form"
            class="changelog-updates__form"
            novalidate
          >
            <label class="changelog-updates__label" for="changelog-updates-email"
              >Email address</label
            >
            <div class="changelog-updates__row">
              <input
                type="email"
                id="changelog-updates-email"
                class="changelog-updates__input"
                name="email"
                autocomplete="email"
                spellcheck="false"
                inputmode="email"
                required
              />
              <button type="submit" class="changelog-updates__submit">
                Sign up
              </button>
            </div>
            <p
              id="changelog-updates-feedback"
              class="changelog-updates__feedback"
              role="status"
              aria-live="polite"
              hidden
            ></p>
          </form>
        </aside>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p class="site-footer__meta">
          Deployed
          <time id="build-date" datetime="__BUILD_DATE_ISO__">__BUILD_DATE__</time>
          · commit
          <code id="commit-sha">__COMMIT_SHA__</code>
        </p>
      </div>
    </footer>

    <script src="./js/main.js" defer></script>
  </body>
</html>
