<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New pilot repo — Status</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <p class="site-header__eyebrow">ECO build pilot</p>
        <h1 class="site-header__title">New pilot repo</h1>
        <p class="site-header__tagline">test tagline</p>
      </div>
    </header>

    <main id="status-main" class="site-main" aria-live="polite">
      <p class="site-main__loading">Loading status…</p>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p class="site-footer__meta">
          Deployed
          <time id="build-date" datetime="__BUILD_DATE_ISO__">__BUILD_DATE__</time>
          · commit
          <code id="commit-sha">__COMMIT_SHA__</code>
        </p>
      </div>
    </footer>

    <script src="./js/main.js" defer></script>
  </body>
</html>
