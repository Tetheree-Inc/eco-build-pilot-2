# PROD (main) is served at /, DEV (develop) at /dev/. Both branches publish one combined
# Pages site, so a push to either rebuilds both paths. The deployment is created for the
# pushed commit (github.sha), which is what the Eco Build Gate matches.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: src/prod }
      - id: checkout_develop
        continue-on-error: true
        uses: actions/checkout@v4
        with: { ref: develop, path: src/dev }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build PROD and DEV
        env:
          HAS_DEV: ${{ steps.checkout_develop.outcome == 'success' }}
        run: |
          set -e
          site() {
            src="$1"; out="$2"; base="$3"
            if [ -f "$src/package.json" ] && node -e "process.exit(require('./$src/package.json').scripts?.build?0:1)"; then
              (cd "$src" && (npm ci || npm install) && BASE_PATH="$base" npm run build)
              mkdir -p "$out" && cp -R "$src/dist/." "$out/"
            else
              mkdir -p "$out" && cp -R "$src/." "$out/"
              rm -rf "$out/.git" "$out/.github"
            fi
          }
          site src/prod _site "/${{ github.event.repository.name }}/"
          if [ "$HAS_DEV" = "true" ]; then
            rm -rf _site/dev
            site src/dev _site/dev "/${{ github.event.repository.name }}/dev/"
          else
            echo "::warning::develop branch not found; publishing PROD only"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v5
